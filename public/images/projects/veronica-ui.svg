<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <rect width="1000" height="560" rx="12" fill="#090b14" stroke="#1d2338" stroke-width="1.5"/>
  <rect width="1000" height="42" rx="12" fill="#0f1422"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="500" y="26" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">veronica.agent :: interactive-visualizer</text>

  <g transform="translate(32, 65)">
    <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Veronica Minimalist Command Interface</text>
    <text x="0" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Real-time neural audio visualizer with dynamic tool invocation timeline and working memory inspector</text>
  </g>

  <!-- Big Central Waveform Visualizer -->
  <g transform="translate(32, 135)">
    <rect width="936" height="180" rx="10" fill="#0d111e" stroke="#1c243a" stroke-width="1"/>
    
    <!-- Central Pulsing Ring -->
    <circle cx="468" cy="90" r="55" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="468" cy="90" r="42" fill="#a855f7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="468" cy="90" r="18" fill="#38bdf8"/>

    <!-- Left & Right Sine / Frequency Waves -->
    <path d="M 60,90 Q 110,30 160,90 T 260,90 T 360,90 L 410,90" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 526,90 L 576,90 Q 626,150 676,90 T 776,90 T 876,90" fill="none" stroke="#c084fc" stroke-width="2.5"/>

    <text x="468" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LISTENING &amp; REASONING...</text>
  </g>

  <!-- Execution Timeline Below -->
  <g transform="translate(32, 335)">
    <rect width="936" height="190" rx="10" fill="#0d111e" stroke="#1c243a" stroke-width="1"/>
    <text x="24" y="32" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Recent Tool Invocations</text>

    <!-- Row 1 -->
    <g transform="translate(24, 50)">
      <rect width="888" height="36" rx="6" fill="#14192b"/>
      <circle cx="18" cy="18" r="4" fill="#10b981"/>
      <text x="36" y="22" fill="#e2e8f0" font-family="monospace" font-size="11">system.run_command("git status &amp;&amp; npm test")</text>
      <text x="860" y="22" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">Exit 0 (240ms)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(24, 94)">
      <rect width="888" height="36" rx="6" fill="#14192b"/>
      <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
      <text x="36" y="22" fill="#e2e8f0" font-family="monospace" font-size="11">mqtt.publish("workspace/esp32/lights", {"mode": "focus", "brightness": 70})</text>
      <text x="860" y="22" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="end">ACK (18ms)</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(24, 138)">
      <rect width="888" height="36" rx="6" fill="#14192b"/>
      <circle cx="18" cy="18" r="4" fill="#a855f7"/>
      <text x="36" y="22" fill="#e2e8f0" font-family="monospace" font-size="11">calendar.query_events(start="now", end="eod")</text>
      <text x="860" y="22" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="end">3 Events Found</text>
    </g>
  </g>
</svg>
