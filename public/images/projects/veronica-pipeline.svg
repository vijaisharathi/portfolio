<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <rect width="1000" height="560" rx="12" fill="#080a12" stroke="#1d2438" stroke-width="1.5"/>
  
  <text x="40" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Veronica Agentic Execution &amp; Tool Calling Pipeline</text>
  <text x="40" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Asynchronous event cycle: Voice intake → Token streaming → Tool DAG resolution → Edge actuator</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Voice Streaming -->
  <g transform="translate(40, 120)">
    <rect width="190" height="150" rx="10" fill="#0e1322" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="34" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">01. INGESTION</text>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Full-Duplex VAD</text>
    <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Client-side voice activity detection &amp; 16kHz PCM audio streaming over WebSocket.</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="230" y1="195" x2="280" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Whisper STT -->
  <g transform="translate(280, 120)">
    <rect width="190" height="150" rx="10" fill="#0e1322" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="34" fill="#818cf8" font-family="monospace" font-size="11" font-weight="700">02. TRANSCRIPTION</text>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Streaming Whisper</text>
    <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sub-second chunked phonetic transcription with punctuation inference.</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="470" y1="195" x2="520" y2="195" stroke="#818cf8" stroke-width="2"/>

  <!-- Box 3: LLM Reasoner -->
  <g transform="translate(520, 120)">
    <rect width="190" height="150" rx="10" fill="#0e1322" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="34" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">03. REASONING</text>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Agent Planner</text>
    <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Evaluates user intent against dynamic JSON schema definitions of registered tools.</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="710" y1="195" x2="760" y2="195" stroke="#a855f7" stroke-width="2"/>

  <!-- Box 4: Execution -->
  <g transform="translate(760, 120)">
    <rect width="200" height="150" rx="10" fill="#0e1322" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="34" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">04. DISPATCH</text>
    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Tool DAG Execution</text>
    <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Parallel and sequential execution of local scripts, OS commands, and IoT MQTT topics.</text>
  </g>

  <!-- Bottom Return Path: Feedback & Neural TTS -->
  <g transform="translate(40, 320)">
    <rect width="920" height="180" rx="10" fill="#0c101c" stroke="#1f283e" stroke-width="1"/>
    <text x="24" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Closed-Loop Verification &amp; Neural Audio Response</text>
    <text x="24" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Results from tool execution feed back into the conversational context and stream back through neural TTS to the client.</text>

    <g transform="translate(24, 80)">
      <rect width="270" height="70" rx="6" fill="#131929"/>
      <text x="16" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Short-Term Working Memory</text>
      <text x="16" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Maintains 20-turn context in Redis ring buffer</text>
    </g>

    <g transform="translate(324, 80)">
      <rect width="270" height="70" rx="6" fill="#131929"/>
      <text x="16" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Hardware Telemetry Feedback</text>
      <text x="16" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">ESP32 sensor acknowledgment within 15ms</text>
    </g>

    <g transform="translate(624, 80)">
      <rect width="270" height="70" rx="6" fill="#131929"/>
      <text x="16" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Sentence-Chunked Neural TTS</text>
      <text x="16" y="50" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Plays first word within 420ms of tool completion</text>
    </g>
  </g>
</svg>
