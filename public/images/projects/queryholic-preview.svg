<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <rect width="1000" height="560" rx="12" fill="#080911" stroke="#1d2238" stroke-width="1.5"/>
  <rect width="1000" height="42" rx="12" fill="#0d1020"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="21" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10b981" opacity="0.8"/>
  <text x="500" y="26" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">queryholic.com • Corporate Platform</text>

  <g transform="translate(40, 65)">
    <text x="0" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Queryholic Digital Flagship Platform</text>
    <text x="0" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Production Next.js application delivering founder-led software engineering, AI automation and IoT hardware solutions.</text>
  </g>

  <!-- Showcase Cards Layout -->
  <g transform="translate(40, 135)">
    <!-- Main Left Feature -->
    <rect width="550" height="390" rx="10" fill="#0e1322" stroke="#1e2740" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <text x="0" y="20" fill="#a855f7" font-family="monospace" font-size="11" font-weight="700">FOUNDER-LED ENGINEERING</text>
      <text x="0" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Bespoke Software + Physical Systems</text>
      <text x="0" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Building scalable platforms for clients ranging from funded startups to industrial green energy projects.</text>
      
      <!-- Metrics Row -->
      <g transform="translate(0, 110)">
        <rect width="155" height="70" rx="8" fill="#141a2e"/>
        <text x="16" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Active Capabilities</text>
        <text x="16" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="800">13 Verticals</text>

        <rect x="170" y="0" width="155" height="70" rx="8" fill="#141a2e"/>
        <text x="186" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Lighthouse Score</text>
        <text x="186" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="800">98 / 100</text>

        <rect x="340" y="0" width="155" height="70" rx="8" fill="#141a2e"/>
        <text x="356" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Stack</text>
        <text x="356" y="52" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Next.js + AI</text>
      </g>

      <!-- Code Snippet preview -->
      <g transform="translate(0, 200)">
        <rect width="495" height="135" rx="8" fill="#090c16" stroke="#182035" stroke-width="1"/>
        <text x="16" y="28" fill="#64748b" font-family="monospace" font-size="11">// Queryholic telemetry stream orchestrator</text>
        <text x="16" y="50" fill="#38bdf8" font-family="monospace" font-size="11">const client = new QueryholicGateway({</text>
        <text x="32" y="70" fill="#cbd5e1" font-family="monospace" font-size="11">aiReasoning: true,</text>
        <text x="32" y="90" fill="#cbd5e1" font-family="monospace" font-size="11">hardwareTelemetry: "esp32-solar-grid-v1",</text>
        <text x="16" y="110" fill="#38bdf8" font-family="monospace" font-size="11">});</text>
      </g>
    </g>

    <!-- Right Side 2 Smaller Stacked Cards -->
    <g transform="translate(570, 0)">
      <rect width="350" height="185" rx="10" fill="#0e1322" stroke="#1e2740" stroke-width="1"/>
      <g transform="translate(20, 20)">
        <text x="0" y="18" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">AI WORKFLOW AUTOMATION</text>
        <text x="0" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Agentic Enterprise Pipelines</text>
        <text x="0" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Eliminating manual data wrangling with custom multi-agent execution graphs.</text>
        <rect x="0" y="95" width="310" height="48" rx="6" fill="#141a2e"/>
        <text x="14" y="124" fill="#10b981" font-family="system-ui, sans-serif" font-size="11">✓ 80% Reduction in Ticket Handling</text>
      </g>

      <g transform="translate(0, 205)">
        <rect width="350" height="185" rx="10" fill="#0e1322" stroke="#1e2740" stroke-width="1"/>
        <g transform="translate(20, 20)">
          <text x="0" y="18" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">HARDWARE &amp; SMART ENERGY</text>
          <text x="0" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Solar &amp; EV Micro-Telemetry</text>
          <text x="0" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ESP32 boards broadcasting live kilowatt generation directly to customer phones.</text>
          <rect x="0" y="95" width="310" height="48" rx="6" fill="#141a2e"/>
          <text x="14" y="124" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">⚡ Live Inverter Telemetry via MQTT</text>
        </g>
      </g>
    </g>
