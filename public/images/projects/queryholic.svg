<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="qh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="50%" stop-color="#090b16"/>
      <stop offset="100%" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="qh-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="qh-shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#qh-bg)"/>
  
  <!-- Glowing ambient auroras -->
  <circle cx="200" cy="180" r="320" fill="#a855f7" opacity="0.1" filter="blur(75px)"/>
  <circle cx="1020" cy="480" r="350" fill="#38bdf8" opacity="0.1" filter="blur(80px)"/>
  <circle cx="600" cy="300" r="260" fill="#6366f1" opacity="0.06" filter="blur(60px)"/>

  <!-- Main Window -->
  <g filter="url(#qh-shadow)" transform="translate(100, 60)">
    <rect width="1000" height="555" rx="16" fill="#0c0e18" stroke="#22273a" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="1000" height="48" rx="16" fill="#0f1220"/>
    <rect y="36" width="1000" height="12" fill="#0f1220"/>
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#1d2235" stroke-width="1"/>
    
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8"/>

    <text x="500" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">https://queryholic.com • Digital Products • AI Automation • Embedded IoT</text>
    
    <rect x="850" y="14" width="126" height="22" rx="11" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="913" y="29" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">FLAGSHIP VENTURE</text>

    <!-- Queryholic Brand Nav inside Canvas -->
    <g transform="translate(32, 65)">
      <text x="0" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">QUERYHOLIC<tspan fill="#a855f7">.</tspan></text>
      <text x="180" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Software Development • AI Automation • IoT Engineering</text>
    </g>

    <!-- Hero Content Banner -->
    <g transform="translate(32, 115)">
      <rect width="936" height="155" rx="12" fill="#111524" stroke="#1d2338" stroke-width="1"/>
      
      <rect x="24" y="20" width="180" height="22" rx="11" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="114" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ENGINEERED FOR SCALE</text>

      <text x="24" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Transforming Visionary Ideas into Production Systems.</text>
      <text x="24" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">From custom web platforms and autonomous AI pipelines to ESP32 smart electronics and EV telemetry.</text>

      <g transform="translate(24, 120)">
        <rect width="140" height="26" rx="6" fill="#a855f7"/>
        <text x="70" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Explore Solutions →</text>
      </g>
    </g>

    <!-- 3 Core Engineering Pillars -->
    <!-- Pillar 1: Software & Web Apps -->
    <g transform="translate(32, 290)">
      <rect width="298" height="235" rx="12" fill="#101422" stroke="#1d253a" stroke-width="1"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#a855f7" fill-opacity="0.15"/>
      <text x="38" y="44" fill="#c084fc" font-size="18" text-anchor="middle">⚡</text>

      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Web &amp; App Development</text>
      <text x="20" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">High-conversion, accessible software</text>

      <g transform="translate(20, 115)">
        <text x="0" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Next.js &amp; React Web Applications</text>
        <text x="0" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Landing Pages &amp; SaaS Portals</text>
        <text x="0" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Mobile App Architectures</text>
        <text x="0" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• High-End UI/UX Design Systems</text>
        <text x="0" y="95" fill="#a855f7" font-family="system-ui, sans-serif" font-size="10" font-weight="600">TypeScript • Tailwind • Framer</text>
      </g>
    </g>

    <!-- Pillar 2: AI & Intelligent Workflows -->
    <g transform="translate(350, 290)">
      <rect width="298" height="235" rx="12" fill="#101422" stroke="#1d253a" stroke-width="1"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
      <text x="38" y="44" fill="#38bdf8" font-size="18" text-anchor="middle">🧠</text>

      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">AI Automation &amp; Agents</text>
      <text x="20" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Autonomous business intelligence</text>

      <g transform="translate(20, 115)">
        <text x="0" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Custom AI Agent Workflows</text>
        <text x="0" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• LLM Tool Calling &amp; RAG Pipelines</text>
        <text x="0" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Document Intelligence &amp; OCR</text>
        <text x="0" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Automated Customer Interactions</text>
        <text x="0" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Python • FastAPI • Vector DBs</text>
      </g>
    </g>

    <!-- Pillar 3: Hardware & IoT -->
    <g transform="translate(668, 290)">
      <rect width="300" height="235" rx="12" fill="#101422" stroke="#1d253a" stroke-width="1"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.15"/>
      <text x="38" y="44" fill="#34d399" font-size="18" text-anchor="middle">🔌</text>

      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">IoT &amp; Embedded Systems</text>
      <text x="20" y="100" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Bridging code and physical devices</text>

      <g transform="translate(20, 115)">
        <text x="0" y="15" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• ESP32 &amp; Arduino Microcontrollers</text>
        <text x="0" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Smart Solar &amp; Energy Telemetry</text>
        <text x="0" y="55" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• EV Charging Unit Logic</text>
        <text x="0" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• Sensor Clouds &amp; MQTT Brokers</text>
        <text x="0" y="95" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="600">C/C++ • MicroPython • MQTT</text>
      </g>
    </g>
  </g>
</svg>
