      <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bikes</text>
      <text x="14" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Foam wash &amp; chain</text>
      <rect x="14" y="98" width="48" height="12" rx="4" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Available</text>
    </g>

    <!-- Card 5: Cars -->
    <g transform="translate(664, 150)">
      <rect width="144" height="120" rx="10" fill="#131926" stroke="#20293d" stroke-width="1"/>
      <rect x="14" y="16" width="36" height="36" rx="8" fill="#ec4899" fill-opacity="0.1"/>
      <text x="32" y="38" fill="#f472b6" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🚗</text>
