    <!-- 6 Service Cards -->
    <!-- Card 1: Clothes -->
    <g transform="translate(32, 150)">
      <rect width="144" height="120" rx="10" fill="#131926" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="14" y="16" width="36" height="36" rx="8" fill="#a855f7" fill-opacity="0.15"/>
      <text x="32" y="38" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">👔</text>
      <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Clothes</text>
      <text x="14" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Dry clean &amp; wash</text>
      <rect x="14" y="98" width="48" height="12" rx="4" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Available</text>
    </g>

    <!-- Card 2: Shoes -->
    <g transform="translate(190, 150)">
      <rect width="144" height="120" rx="10" fill="#131926" stroke="#20293d" stroke-width="1"/>
      <rect x="14" y="16" width="36" height="36" rx="8" fill="#38bdf8" fill-opacity="0.1"/>
      <text x="32" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">👟</text>
      <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Shoes</text>
      <text x="14" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Deep scrub &amp; revive</text>
      <rect x="14" y="98" width="48" height="12" rx="4" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Available</text>
    </g>

    <!-- Card 3: Helmets -->
    <g transform="translate(348, 150)">
      <rect width="144" height="120" rx="10" fill="#131926" stroke="#20293d" stroke-width="1"/>
      <rect x="14" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.1"/>
      <text x="32" y="38" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">⛑️</text>
      <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Helmets</text>
      <text x="14" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Foam sterilize</text>
      <rect x="14" y="98" width="48" height="12" rx="4" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Available</text>
