      <text x="32" y="38" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🎒</text>
      <text x="14" y="74" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bags</text>
      <text x="14" y="92" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Leather &amp; travel</text>
      <rect x="14" y="98" width="48" height="12" rx="4" fill="#22c55e" fill-opacity="0.15"/>
      <text x="38" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Available</text>
    </g>

    <!-- Bottom Section: Active Order Tracker -->
