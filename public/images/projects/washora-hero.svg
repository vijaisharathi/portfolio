    <text x="145" y="81" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MULTI-SERVICE MARKETPLACE</text>

    <!-- Role Switcher Badges (Simulating frontend isolation) -->
    <g transform="translate(620, 64)">
      <rect x="0" y="0" width="76" height="24" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
      <text x="38" y="16" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" font-weight="600">Customer</text>
      
      <rect x="84" y="0" width="76" height="24" rx="6" fill="#161c28"/>
      <text x="122" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Provider</text>

      <rect x="168" y="0" width="76" height="24" rx="6" fill="#161c28"/>
      <text x="206" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Delivery</text>

      <rect x="252" y="0" width="76" height="24" rx="6" fill="#161c28"/>
      <text x="290" y="16" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Admin</text>
