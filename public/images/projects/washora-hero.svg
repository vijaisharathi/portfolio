      <text x="825" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔐 Two-Way OTP Active</text>

      <!-- Stepper Line -->
      <line x1="80" y1="110" x2="850" y2="110" stroke="#1e293b" stroke-width="3"/>
      <line x1="80" y1="110" x2="520" y2="110" stroke="#a855f7" stroke-width="3"/>

      <!-- Steps -->
      <!-- Step 1: Confirmed -->
      <g transform="translate(80, 110)">
        <circle cx="0" cy="0" r="14" fill="#a855f7"/>
        <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">✓</text>
        <text x="0" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Booked</text>
        <text x="0" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">10:15 AM</text>
      </g>

      <!-- Step 2: Pickup Done -->
      <g transform="translate(260, 110)">
        <circle cx="0" cy="0" r="14" fill="#a855f7"/>
        <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">✓</text>
        <text x="0" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Picked Up</text>
        <text x="0" y="46" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">OTP Confirmed</text>
      </g>

      <!-- Step 3: In Workshop -->
      <g transform="translate(440, 110)">
        <circle cx="0" cy="0" r="14" fill="#a855f7"/>
        <circle cx="0" cy="0" r="20" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>
        <text x="0" y="4" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">⚙️</text>
        <text x="0" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">In Treatment</text>
        <text x="0" y="46" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ultrasonic Wash</text>
      </g>

      <!-- Step 4: Quality Check -->
      <g transform="translate(620, 110)">
        <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <text x="0" y="4" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">4</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">QA Passed</text>
        <text x="0" y="46" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pending</text>
      </g>

      <!-- Step 5: Return -->
      <g transform="translate(800, 110)">
        <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
        <text x="0" y="4" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">5</text>
        <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Doorstep Return</text>
        <text x="0" y="46" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">OTP Handover</text>
      </g>

      <!-- Role Boundary Banner inside Order -->
      <rect x="24" y="180" width="886" height="38" rx="8" fill="#161c2a" stroke="#253046" stroke-width="1"/>
      <circle cx="44" cy="199" r="5" fill="#10b981"/>
      <text x="60" y="203" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Architecture Guard: Frontend token isolated under <tspan fill="#38bdf8" font-family="monospace">/app/customer/*</tspan>. Provider intake cameras and admin accounting triggers are stripped from client bundle.</text>
    </g>
  </g>
</svg>
