      <rect width="934" height="235" rx="12" fill="#111624" stroke="#1f273a" stroke-width="1"/>
      
      <!-- Tracker Header -->
      <text x="24" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Live Service Pipeline • Order #WSH-8941</text>
      <text x="24" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Selected: Premium Shoe Restoration + Riding Helmet Sterilization</text>
      
      <!-- Security Badge -->
