<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#07080f"/>
      <stop offset="100%" stop-color="#0d111d"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Ambient Gradients -->
  <circle cx="200" cy="150" r="300" fill="#a855f7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="1000" cy="500" r="350" fill="#38bdf8" opacity="0.08" filter="blur(70px)"/>
  <circle cx="600" cy="300" r="220" fill="#8b5cf6" opacity="0.06" filter="blur(50px)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Main Window Frame -->
  <g filter="url(#shadow)" transform="translate(100, 60)">
    <!-- Window Container -->
    <rect width="1000" height="555" rx="16" fill="#0d111a" stroke="#252b3b" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect width="1000" height="48" rx="16" fill="#111723"/>
    <rect y="36" width="1000" height="12" fill="#111723"/>
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#1f2737" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8"/>

    <!-- URL Bar -->
    <rect x="180" y="12" width="640" height="24" rx="6" fill="#0a0d14" stroke="#232a3a" stroke-width="1"/>
    <text x="500" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" letter-spacing="0.5">https://washora.platform.internal/app/marketplace</text>

    <!-- Role Indicator Pill -->
    <rect x="880" y="12" width="96" height="24" rx="12" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.4"/>
    <text x="928" y="28" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CUSTOMER</text>

    <!-- Application Top Bar -->
