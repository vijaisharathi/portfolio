<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="zl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#05080e"/>
      <stop offset="100%" stop-color="#09101c"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="zl-shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#zl-bg)"/>
  
  <!-- Subtle ambient glows -->
  <circle cx="250" cy="220" r="300" fill="#10b981" opacity="0.06" filter="blur(65px)"/>
  <circle cx="950" cy="400" r="320" fill="#38bdf8" opacity="0.07" filter="blur(70px)"/>

  <!-- Console Window -->
  <g filter="url(#zl-shadow)" transform="translate(100, 60)">
    <rect width="1000" height="555" rx="16" fill="#0c101a" stroke="#1d2639" stroke-width="1.5"/>
    
    <!-- Top Chrome -->
    <rect width="1000" height="48" rx="16" fill="#101624"/>
    <rect y="36" width="1000" height="12" fill="#101624"/>
    <line x1="0" y1="48" x2="1000" y2="48" stroke="#1c2538" stroke-width="1"/>
    
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8"/>

    <text x="500" y="29" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">ZooLearn • Interactive 3D Spatial Biology &amp; NEET Preparation Suite</text>
    
    <rect x="850" y="14" width="126" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="913" y="29" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">WebGL 60 FPS</text>

    <!-- App Body -->
    <!-- Left: 3D Spatial Anatomical Viewport -->
    <g transform="translate(36, 70)">
      <rect width="560" height="450" rx="12" fill="#090d16" stroke="#1c2438" stroke-width="1"/>
      
      <!-- 3D Canvas Wireframe & Model Simulation (Human Heart / Biology) -->
      <g transform="translate(280, 220)">
        <!-- Grid Floor -->
        <ellipse cx="0" cy="120" rx="180" ry="45" fill="none" stroke="#1e293b" stroke-width="1"/>
        <ellipse cx="0" cy="120" rx="120" ry="30" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
        <ellipse cx="0" cy="120" rx="60" ry="15" fill="none" stroke="#475569" stroke-width="1"/>
        
        <!-- 3D Organ Geometric Nodes (Heart Chamber / Cellular Architecture) -->
        <path d="M-60,-80 C-110,-40 -120,40 -20,100 C-10,105 10,105 20,100 C120,40 110,-40 60,-80 C30,-100 -30,-100 -60,-80 Z" fill="#1e1832" stroke="#a855f7" stroke-width="2" opacity="0.85"/>
        <path d="M-40,-60 C-80,-20 -90,30 -10,75 C0,80 10,80 20,75 C90,30 80,-20 40,-60 Z" fill="#24143a" stroke="#ec4899" stroke-width="1.5" opacity="0.9"/>
        <path d="M-20,-75 L-20,-115 L10,-115 L10,-75" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
        <path d="M15,-65 L45,-100 L65,-85 L35,-55" fill="none" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>

        <!-- Interactive Hotspots -->
        <g transform="translate(-50, -20)">
          <circle cx="0" cy="0" r="14" fill="#38bdf8" fill-opacity="0.2"/>
          <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
          <line x1="0" y1="0" x2="-80" y2="-40" stroke="#38bdf8" stroke-width="1.5"/>
          <rect x="-195" y="-55" width="115" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
          <text x="-138" y="-37" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Left Ventricle</text>
        </g>

        <g transform="translate(45, 20)">
          <circle cx="0" cy="0" r="14" fill="#a855f7" fill-opacity="0.2"/>
          <circle cx="0" cy="0" r="5" fill="#c084fc"/>
          <line x1="0" y1="0" x2="70" y2="40" stroke="#a855f7" stroke-width="1.5"/>
          <rect x="70" y="25" width="125" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
          <text x="132" y="43" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Bicuspid Valve</text>
        </g>
      </g>

      <!-- Viewport Floating Controls -->
      <g transform="translate(20, 20)">
        <rect width="180" height="36" rx="8" fill="#131929" stroke="#222d42" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">3D ANATOMY ENGINE</text>
      </g>

      <g transform="translate(400, 20)">
        <rect width="140" height="36" rx="8" fill="#131929" stroke="#222d42" stroke-width="1"/>
        <text x="70" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Orbit • Dissect • Zoom</text>
      </g>
    </g>

    <!-- Right: NEET Concept & MCQ Drill Pane -->
    <g transform="translate(615, 70)">
      <rect width="350" height="450" rx="12" fill="#0f1422" stroke="#1d2639" stroke-width="1"/>
      
      <!-- NEET Badge -->
      <g transform="translate(20, 24)">
        <rect width="110" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
        <text x="55" y="15" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEET PRACTICE</text>
      </g>
      <text x="20" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cardiac Cycle: Systemic Flow</text>
      <text x="20" y="88" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Chapter 18 • Body Fluids &amp; Circulation</text>

      <!-- Question Box -->
      <g transform="translate(20, 110)">
        <rect width="310" height="85" rx="8" fill="#131b2c" stroke="#25324b" stroke-width="1"/>
        <text x="14" y="26" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Q. Which heart structure prevents backflow</text>
        <text x="14" y="44" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">of oxygenated blood into the left atrium during</text>
        <text x="14" y="62" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ventricular systole?</text>
      </g>

      <!-- MCQ Options -->
      <g transform="translate(20, 210)">
        <!-- Option A -->
        <rect width="310" height="38" rx="6" fill="#141a29" stroke="#1e283d" stroke-width="1"/>
        <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">A. Tricuspid valve</text>

        <!-- Option B (Correct selected) -->
        <g transform="translate(0, 48)">
          <rect width="310" height="38" rx="6" fill="#152528" stroke="#10b981" stroke-width="1.5"/>
          <text x="16" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">B. Bicuspid (Mitral) valve</text>
          <text x="290" y="24" fill="#34d399" font-size="12" text-anchor="end">✓</text>
        </g>

        <!-- Option C -->
        <g transform="translate(0, 96)">
          <rect width="310" height="38" rx="6" fill="#141a29" stroke="#1e283d" stroke-width="1"/>
          <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">C. Aortic semilunar valve</text>
        </g>
      </g>

      <!-- Taxonomy Mini Tree -->
      <g transform="translate(20, 375)">
        <rect width="310" height="52" rx="6" fill="#111726" stroke="#202c44" stroke-width="1"/>
        <text x="12" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">TAXONOMIC PATHWAY</text>
        <text x="12" y="38" fill="#38bdf8" font-family="monospace" font-size="10">Chordata &gt; Mammalia &gt; Primates &gt; H. sapiens</text>
      </g>
    </g>
  </g>
</svg>
