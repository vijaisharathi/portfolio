<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <rect width="1000" height="560" rx="12" fill="#080a12" stroke="#1c2234" stroke-width="1.5"/>
  
  <text x="40" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">WASHORA Multi-Role Frontend Isolation Architecture</text>
  <text x="40" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Deep isolation matrix: Zero route bleed, independent layouts, and edge token boundary enforcement</text>

  <!-- 4 Role Pillars -->
  <!-- Pillar 1: Customer -->
  <g transform="translate(40, 110)">
    <rect width="210" height="410" rx="10" fill="#0e1320" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="210" height="40" rx="10" fill="#151b2e"/>
    <text x="105" y="25" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CUSTOMER ROLE</text>
    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-size="10">Prefix: /app/customer/*</text>
      <text x="0" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Surfaces:</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Catalog Discovery</text>
      <text x="0" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Custom Care Basket</text>
      <text x="0" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• 7-Stage Order Pipeline</text>
      <text x="0" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Ratings &amp; Receipts</text>

      <line x1="0" y1="130" x2="178" y2="130" stroke="#1f283c"/>

      <text x="0" y="150" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Route Isolation:</text>
      <text x="0" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Layout: Isolated Consumer shell.</text>
      <text x="0" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Bundle: 0% Vendor or Admin code.</text>
      
      <rect x="0" y="260" width="178" height="60" rx="6" fill="#131929" stroke="#25324d" stroke-width="1"/>
      <text x="12" y="282" fill="#10b981" font-family="monospace" font-size="10">Token: Bearer &lt;cust&gt;</text>
      <text x="12" y="302" fill="#64748b" font-family="monospace" font-size="9">Claims: role="customer"</text>
    </g>
  </g>

  <!-- Pillar 2: Provider -->
  <g transform="translate(275, 110)">
    <rect width="210" height="410" rx="10" fill="#0e1320" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="210" height="40" rx="10" fill="#151b2e"/>
    <text x="105" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SERVICE PROVIDER</text>
    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-size="10">Prefix: /app/provider/*</text>
      <text x="0" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Surfaces:</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Workshop Kanban</text>
      <text x="0" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Intake Camera Terminal</text>
      <text x="0" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Equipment Queue</text>
      <text x="0" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Payout Statements</text>

      <line x1="0" y1="130" x2="178" y2="130" stroke="#1f283c"/>

      <text x="0" y="150" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Route Isolation:</text>
      <text x="0" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Layout: Workshop dark dashboard.</text>
      <text x="0" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Tenancy: Scoped to Workshop ID.</text>

      <rect x="0" y="260" width="178" height="60" rx="6" fill="#131929" stroke="#25324d" stroke-width="1"/>
      <text x="12" y="282" fill="#38bdf8" font-family="monospace" font-size="10">Token: Bearer &lt;prov&gt;</text>
      <text x="12" y="302" fill="#64748b" font-family="monospace" font-size="9">Claims: role="provider"</text>
    </g>
  </g>

  <!-- Pillar 3: Delivery -->
  <g transform="translate(510, 110)">
    <rect width="210" height="410" rx="10" fill="#0e1320" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="40" rx="10" fill="#151b2e"/>
    <text x="105" y="25" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DELIVERY PARTNER</text>
    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-size="10">Prefix: /app/delivery/*</text>
      <text x="0" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Surfaces:</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Run Sheet &amp; Navigation</text>
      <text x="0" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• 2-Way OTP Verification</text>
      <text x="0" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• GPS Heartbeat Stream</text>
      <text x="0" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Dispatch Earnings</text>

      <line x1="0" y1="130" x2="178" y2="130" stroke="#1f283c"/>

      <text x="0" y="150" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Route Isolation:</text>
      <text x="0" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Layout: Mobile-first field view.</text>
      <text x="0" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Tenancy: Scoped to Courier ID.</text>

      <rect x="0" y="260" width="178" height="60" rx="6" fill="#131929" stroke="#25324d" stroke-width="1"/>
      <text x="12" y="282" fill="#f59e0b" font-family="monospace" font-size="10">Token: Bearer &lt;deli&gt;</text>
      <text x="12" y="302" fill="#64748b" font-family="monospace" font-size="9">Claims: role="delivery"</text>
    </g>
  </g>

  <!-- Pillar 4: Admin -->
  <g transform="translate(745, 110)">
    <rect width="215" height="410" rx="10" fill="#0e1320" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="215" height="40" rx="10" fill="#151b2e"/>
    <text x="107" y="25" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ADMIN / OPERATIONS</text>
    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-size="10">Prefix: /app/admin/*</text>
      <text x="0" y="38" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Surfaces:</text>
      <text x="0" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Master Command Center</text>
      <text x="0" y="76" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Merchant KYC Approvals</text>
      <text x="0" y="94" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• SLA Breach Escalations</text>
      <text x="0" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">• Commission &amp; Payouts</text>

      <line x1="0" y1="130" x2="183" y2="130" stroke="#1f283c"/>

      <text x="0" y="150" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Route Isolation:</text>
      <text x="0" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Layout: Executive Operations HUD.</text>
      <text x="0" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Guard: Hardware MFA + IP guard.</text>

      <rect x="0" y="260" width="183" height="60" rx="6" fill="#131929" stroke="#25324d" stroke-width="1"/>
      <text x="12" y="282" fill="#ef4444" font-family="monospace" font-size="10">Token: Bearer &lt;admin&gt;</text>
      <text x="12" y="302" fill="#64748b" font-family="monospace" font-size="9">Claims: role="superadmin"</text>
    </g>
  </g>
</svg>
